# .github/workflows/release.yml
# Build + publish to PyPI. Manual trigger only (workflow_dispatch).
#
# The repository is private but the package is not: `rhosocial-mcpserver` is
# public on PyPI and depends on `rhosocial-activerecord`, which is too.  Trusted
# Publishing needs no token; configure the "pypi" environment on PyPI to trust
# this repo + workflow.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to publish'
        required: true
        type: string

jobs:
  check:
    if: inputs.confirm != 'release'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::confirmation was '${{ inputs.confirm }}', not 'release'."
          exit 1

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build tool
        run: python -m pip install -U pip build twine
      - name: Verify the version is not already published
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if python -m pip download "rhosocial-mcpserver==$VERSION" -d /tmp/seen --no-deps 2>/dev/null; then
            echo "::error::$VERSION is already on PyPI. Bump pyproject.toml first."
            exit 1
          fi
      - name: Build
        run: python -m build
      - name: Check
        run: |
          twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
