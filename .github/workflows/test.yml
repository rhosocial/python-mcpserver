# .github/workflows/test.yml
# Test matrix: SQLite only, across the Python range the MCP SDK v2 supports.
#
# Why SQLite only: this library does not speak SQL — every statement is
# generated by rhosocial-activerecord from a model's annotations — and the only
# backend-specific code here is `orm/ddl.serial_type_for`, which asks the
# dialect what it calls an auto-increment key.  Running the suite nine times to
# exercise a path that cannot differ by backend buys nothing and costs minutes.
#
# What does vary across versions is the Python floor: 3.10 is the MCP SDK v2's
# minimum, and a silent bump there is the most likely way this package breaks a
# consumer.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src:tests

  # ── Where the core ORM comes from ────────────────────────────────────────
  #
  # One variable, because this is the single point where this package's
  # correctness depends on another repository's release state, and a reader
  # should be able to see it without reading an install step.
  #
  # It is a git URL, not a version, and that is deliberate for now.  This
  # package uses two things the newest published core release (1.0.0.dev29) does
  # not have: the `IDataPreparationBehavior` save hook, and a `ColumnConstraint`
  # that carries a dialect.  So the pin in pyproject.toml — `>=1.0.0.dev30` — is
  # correct and unsatisfiable from any index, and pip's answer to that is a
  # `ResolutionImpossible` wall that says nothing about why.
  #
  # The ref is a **branch**, not a tag, and that is the cost of the current
  # arrangement: it moves, so two runs of the same commit can install different
  # core code, and a green run says nothing about what a release would install.
  # When dev30 ships, replace the value below with
  # `rhosocial-activerecord>=1.0.0.dev30`, delete the `preflight` job, and put
  # the version check back in release.yml.  Nothing else changes.
  #
  # pyproject.toml deliberately keeps a plain version specifier rather than a
  # git URL: PyPI refuses a direct-URL dependency at upload time, and a consumer
  # resolving this package could not clone the core anyway.
  CORE_SOURCE: >-
    git+https://github.com/rhosocial/python-activerecord@feature/readonly-object-type-query-named-examples

jobs:
  preflight:
    name: preflight — the pinned core is obtainable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Runs before any install, and fails with the reason rather than letting
      # pip report a resolution wall.  Worth a separate job because it is the
      # failure that otherwise costs the longest to diagnose.
      #
      # With CORE_SOURCE set to a git URL this resolves the ref and reads the
      # version out of it — asking an index about a git source would answer a
      # question nobody asked.
      - name: Check the pinned core is obtainable
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip packaging
          python scripts/check_core_version.py \
            --source "$CORE_SOURCE" --required '>=1.0.0.dev30'

  sqlite:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          # An editable install of the core library, because this package's tests
          # are about what it does to a query's WHERE clause and must run against
          # that source.  `--no-deps` on the core install only: this package then
          # resolves the core's own transitive dependencies normally.
          # The core first, non-editable: pip then resolves this package's
          # `rhosocial-activerecord>=1.0.0.dev30` against what is already
          # installed, and never looks for it on an index.  Order matters —
          # the other way round, pip tries the index first and fails there.
          python -m pip install "$CORE_SOURCE"
          python -m pip install -e ".[dev]"
      - name: Report the resolved versions
        # `importlib.metadata`, not `__version__`: rhosocial.activerecord is a
        # PEP 420 namespace package with no module-level attribute, so the
        # obvious form of this line raises rather than reporting anything.
        run: |
          python -c "from importlib.metadata import version; \
            print('core    ', version('rhosocial-activerecord')); \
            print('self    ', version('rhosocial-mcpserver'))"
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Types
        run: mypy src/
      - name: Test
        run: python -m pytest tests/ -v