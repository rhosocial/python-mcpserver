# .github/workflows/test.yml
# Test matrix: SQLite only.
#
# Deliberately not the family-wide nine-backend matrix.  This library does not
# speak SQL — every statement is generated by rhosocial-activerecord from a
# model's annotations — and the only backend-specific code here is
# `orm/ddl.serial_type_for`, which asks the dialect what it calls an
# auto-increment key.  Running the suite nine times to check a code path that
# cannot differ by backend buys nothing and costs CI minutes.
#
# What IS covered across versions is the surface that genuinely varies: the
# Python versions the MCP SDK v2 supports (3.10+), since it is a hard floor and
# a silent bump is the most likely way this package breaks a consumer.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src:tests

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          # The core ORM in editable mode: this library's tests are about what
          # it does to a query's WHERE clause, so they must run against the
          # working tree, not a published wheel.
          python -m pip install -e ../python-activerecord || \
            python -m pip install "git+https://github.com/rhosocial/python-activerecord" -e ".[dev]"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Types
        run: mypy src/
      - name: Test
        run: python -m pytest tests/ -v

  # A local editable install of the core library is not available in CI, so the
  # published package is the only thing to test against.  Kept as a separate job
  # so a core release that breaks this library is distinguishable from a mistake
  # here.
  published-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v
