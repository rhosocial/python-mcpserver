# .github/workflows/test.yml
# Test matrix: SQLite only, across the Python range the MCP SDK v2 supports.
#
# Why SQLite only: this library does not speak SQL — every statement is
# generated by rhosocial-activerecord from a model's annotations — and the only
# backend-specific code here is `orm/ddl.serial_type_for`, which asks the
# dialect what it calls an auto-increment key.  Running the suite nine times to
# exercise a path that cannot differ by backend buys nothing and costs minutes.
#
# What does vary across versions is the Python floor: 3.10 is the MCP SDK v2's
# minimum, and a silent bump there is the most likely way this package breaks a
# consumer.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src:tests

  # ── Where the core ORM comes from ────────────────────────────────────────
  #
  # One variable, because this is the single point where this package's
  # correctness depends on another repository's release state, and a reader
  # should be able to see it without reading an install step.
  #
  # It is a git URL, not a version, and that is deliberate for now.  This
  # package needs the column-constraint rebuild plus the DDL/DML `*Statement`
  # renames (`CreateTableStatement`, `CreateIndexStatement`, ...) that live on
  # fix/column-constraint-gates; the published 1.0.0.dev30 predates them.  The
  # pin in pyproject.toml is therefore only a version floor, and a release cut
  # from that branch must be published before this package is released.
  #
  # The ref is a **branch**, not a tag, and that is the cost of the current
  # arrangement: it moves, so two runs of the same commit can install different
  # core code, and a green run says nothing about what a release would install.
  # When a release is cut from that branch, replace the value below with
  # `rhosocial-activerecord>=<that version>`, delete the `preflight` job, and
  # put the version check back in release.yml.  Nothing else changes.
  #
  # pyproject.toml deliberately keeps a plain version specifier rather than a
  # git URL: PyPI refuses a direct-URL dependency at upload time, and a consumer
  # resolving this package could not clone the core anyway.
  CORE_SOURCE: >-
    git+https://github.com/rhosocial/python-activerecord@fix/column-constraint-gates

jobs:
  preflight:
    name: preflight — the pinned core is obtainable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Runs before any install, and fails with the reason rather than letting
      # pip report a resolution wall.  Worth a separate job because it is the
      # failure that otherwise costs the longest to diagnose.
      #
      # With CORE_SOURCE set to a git URL this resolves the ref and reads the
      # version out of it — asking an index about a git source would answer a
      # question nobody asked.
      - name: Check the pinned core is obtainable
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip packaging
          python scripts/check_core_version.py \
            --source "$CORE_SOURCE" --required '>=1.0.0.dev30'

  sqlite:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          # An editable install of the core library, because this package's tests
          # are about what it does to a query's WHERE clause and must run against
          # that source.  `--no-deps` on the core install only: this package then
          # resolves the core's own transitive dependencies normally.
          # The core first, non-editable: pip then resolves this package's
          # `rhosocial-activerecord>=1.0.0.dev30` against what is already
          # installed, and never looks for it on an index.  Order matters —
          # the other way round, pip tries the index first and fails there.
          python -m pip install "$CORE_SOURCE"
          python -m pip install -e ".[dev]"
      - name: Report the resolved versions
        # `importlib.metadata`, not `__version__`: rhosocial.activerecord is a
        # PEP 420 namespace package with no module-level attribute, so the
        # obvious form of this line raises rather than reporting anything.
        run: |
          python -c "from importlib.metadata import version; \
            print('core    ', version('rhosocial-activerecord')); \
            print('self    ', version('rhosocial-mcpserver'))"
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Types
        run: mypy src/
      - name: Test
        # `--timeout` comes from pyproject's addopts.  The job-level
        # `timeout-minutes` is the backstop for a hang in something pytest
        # cannot interrupt — an atexit handler, say.
        run: python -m pytest tests/ -v
        timeout-minutes: 10

  postgres:
    needs: preflight
    name: PostgreSQL 18 / Python 3.15
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          python -m pip install "$CORE_SOURCE"
          python -m pip install "git+https://github.com/rhosocial/python-activerecord-postgres.git@fix/column-constraint-gates"
          python -m pip install "psycopg[binary]"
          python -m pip install -e ".[dev]"
      - name: Test the ORM against PostgreSQL
        env:
          MCP_TEST_SCENARIO: postgres_18
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: "5432"
          MCP_TEST_DB_NAME: test_db
          MCP_TEST_DB_USER: root
          MCP_TEST_DB_PASSWORD: password
        run: python -m pytest tests/rhosocial/mcpserver_test/orm -v

  mysql:
    needs: preflight
    name: MySQL 9.7 / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          python -m pip install "$CORE_SOURCE"
          python -m pip install "git+https://github.com/rhosocial/python-activerecord-mysql.git@fix/column-constraint-gates"
          python -m pip install mysql-connector-python
          python -m pip install -e ".[dev]"
      - name: Test the ORM against MySQL
        env:
          MCP_TEST_SCENARIO: mysql_97
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: "3306"
          MCP_TEST_DB_NAME: test_db
          MCP_TEST_DB_USER: root
          MCP_TEST_DB_PASSWORD: password
        run: python -m pytest tests/rhosocial/mcpserver_test/orm -v

  mariadb:
    needs: preflight
    name: MariaDB 13.0 / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:13.0
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          python -m pip install "$CORE_SOURCE"
          python -m pip install "git+https://github.com/rhosocial/python-activerecord-mariadb.git@fix/column-constraint-gates"
          python -m pip install mariadb
          python -m pip install -e ".[dev]"
      - name: Test the ORM against MariaDB
        env:
          MCP_TEST_SCENARIO: mariadb_130
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: "3306"
          MCP_TEST_DB_NAME: test_db
          MCP_TEST_DB_USER: root
          MCP_TEST_DB_PASSWORD: password
        run: python -m pytest tests/rhosocial/mcpserver_test/orm -v

  sqlserver:
    needs: preflight
    name: SQL Server 2022 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -N -C || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the ODBC driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Create the test database
        run: |
          # -C trusts the container's self-signed certificate; ODBC Driver 18
          # encrypts by default and refuses it otherwise.
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C \
            -Q "IF DB_ID('test_db') IS NULL CREATE DATABASE test_db"
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          python -m pip install "$CORE_SOURCE"
          python -m pip install "git+https://github.com/rhosocial/python-activerecord-sqlserver.git@fix/column-constraint-gates"
          python -m pip install pyodbc aioodbc
          python -m pip install -e ".[dev]"
      - name: Test the ORM against SQL Server
        env:
          MCP_TEST_SCENARIO: sqlserver_2022
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: "1433"
          MCP_TEST_DB_NAME: test_db
          MCP_TEST_DB_USER: sa
          MCP_TEST_DB_PASSWORD: Password123!
        run: python -m pytest tests/rhosocial/mcpserver_test/orm -v

  oracle:
    needs: preflight
    name: Oracle Free 23 / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: password
          ORACLE_CHARACTERSET: AL32UTF8
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 30s
          --health-timeout 60s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        env:
          CORE_SOURCE: ${{ env.CORE_SOURCE }}
        run: |
          python -m pip install -U pip
          python -m pip install "$CORE_SOURCE"
          python -m pip install "git+https://github.com/rhosocial/python-activerecord-oracle.git@fix/column-constraint-gates"
          python -m pip install oracledb
          python -m pip install -e ".[dev]"
      - name: Test the ORM against Oracle
        env:
          MCP_TEST_SCENARIO: oracle_free
          MCP_TEST_DB_HOST: 127.0.0.1
          MCP_TEST_DB_PORT: "1521"
          MCP_TEST_DB_SERVICE_NAME: FREEPDB1
          MCP_TEST_DB_USER: system
          MCP_TEST_DB_PASSWORD: password
        run: python -m pytest tests/rhosocial/mcpserver_test/orm -v